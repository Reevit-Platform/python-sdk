[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reevit"
description = "Reevit Python SDK — Unified payment orchestration for Africa (Paystack, Hubtel, Flutterwave, M-Pesa, Moolre, Monnify, PawaPay, Stripe)"
keywords = ["reevit", "payment-orchestration", "payments", "africa", "ghana", "nigeria", "kenya", "mobile-money", "paystack", "hubtel", "flutterwave", "mpesa", "moolre", "monnify", "pawapay", "stripe"]
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
authors = [{ name = "Reevit" }]
# Read statically from reevit/_version.py, which is deliberately import-free
# so the package's runtime dependencies are not needed at build time.
dynamic = ["version"]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.25.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

# Test dependencies live here, not only in the CI workflow: tests/test_client.py
# imports requests_mock, and a workflow that forgets it fails at collection.
[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-cov",
    "requests-mock>=1.11",
]

[project.urls]
Homepage = "https://reevit.io"
Documentation = "https://docs.reevit.io"
Repository = "https://github.com/Reevit-Platform/python-sdk"
Issues = "https://github.com/Reevit-Platform/python-sdk/issues"

[tool.setuptools.dynamic]
version = { attr = "reevit._version.__version__" }

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
reevit = ["py.typed"]
